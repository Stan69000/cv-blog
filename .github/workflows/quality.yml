name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Astro Check and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Astro checks
        run: npm run check

      # High-severity transitive advisories currently have no non-breaking fix.
      # Keep critical vulnerabilities blocking while Dependabot tracks upstream fixes.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Build the production site
        run: npm run build:o2switch
